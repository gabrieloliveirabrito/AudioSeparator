# Publishes AudioSeparator packages to NuGet.org.
# Setup on nuget.org: Account → Trusted Publishing → policy for workflow file "nuget-publish.yml"
# GitHub secrets: NUGET_USER (nuget.org username, not email)

name: Publish NuGet packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: sh restore-all.sh

      - name: Pack
        run: |
          mkdir -p artifacts
          projects=(
            AudioSeparator.Abstractions/AudioSeparator.Abstractions.csproj
            AudioSeparator.Core/AudioSeparator.Core.csproj
            AudioSeparator.FFMPEG/AudioSeparator.FFMPEG.csproj
            AudioSeparator.NAudio/AudioSeparator.NAudio.csproj
            AudioSeparator.Onnx/AudioSeparator.Onnx.csproj
            AudioSeparator.Onnx.Demucs/AudioSeparator.Onnx.Demucs.csproj
            AudioSeparator.Benchmark/AudioSeparator.Benchmark.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" -c Release --no-restore -o ./artifacts
          done

      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
